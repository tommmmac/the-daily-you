# The Copy Desk writes and edits the printed entry.
# Only reached through buttons: Go to print (newsroom/print.ts) and each page's
# Edit button (newsroom/edit.ts). Never from free-text chat, so a casual reply
# can't be mistaken for an edit.
name: copydesk
description: Writes and edits the pages of the printed diary entry.
enabled: true
routable: false
model: copydesk
output: story # replies with JSON matching schemas/story.ts
