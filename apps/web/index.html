<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ea" />
    <script>
      // Put the saved paper on before the first paint so it doesn't flash. src/lib/theme.ts does the rest.
      try {
        var t = localStorage.getItem("theme");
        if (["broadsheet", "tabloid", "night", "gazette", "gossip", "terminal"].indexOf(t) < 0) {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "broadsheet";
        }
        document.documentElement.dataset.theme = t;
        if (t === "night" || t === "terminal") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-title" content="Daily You" />
    <title>The Daily You</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
